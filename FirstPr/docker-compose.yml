version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interviewpass
      POSTGRES_DB: interview
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    command: gunicorn -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:8000 --workers 4
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://interview:interviewpass@db:5432/interview
      SECRET_KEY: replace-me-with-a-secure-value
      CORS_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    ports:
      - "8000:8000"

  frontend:
    image: node:20-bullseye
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  db-data:
