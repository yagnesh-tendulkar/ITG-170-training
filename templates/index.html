<!DOCTYPE html>
<html>
<head>
    <title>Basic RAG Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        
        .section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .message {
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .answer-box {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            margin-top: 10px;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .status {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 RAG (Retrieval Augmented Generation) Demo</h1>
        
        <!-- Upload Section -->
        <div class="section">
            <h2>Step 1: Upload a PDF</h2>
            <div class="form-group">
                <input type="file" id="pdfFile" accept=".pdf">
            </div>
            <button onclick="uploadPDF()">Upload PDF</button>
            <div id="uploadMessage"></div>
        </div>
        
        <!-- Question Section -->
        <div class="section">
            <h2>Step 2: Ask a Question</h2>
            <p class="status">Make sure you've uploaded a PDF first!</p>
            <div class="form-group">
                <input type="text" id="questionInput" placeholder="Ask a question about your PDF...">
            </div>
            <button onclick="askQuestion()">Ask Question</button>
            <div id="answerMessage"></div>
            <div id="answerBox"></div>
        </div>
    </div>
    
    <script>
        // Upload PDF Function
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0];
            const messageDiv = document.getElementById('uploadMessage');
            
            if (!file) {
                messageDiv.innerHTML = '<div class="message error">Please select a PDF file</div>';
                return;
            }
            
            // Create form data
            const formData = new FormData();
            formData.append('pdf', file);
            
            // Show loading message
            messageDiv.innerHTML = '<div class="message loading">⏳ Uploading and processing PDF...</div>';
            
            try {
                // Send to backend
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = `<div class="message success">✅ ${data.message} (${data.chunks_created} chunks created)</div>`;
                    fileInput.value = '';
                } else {
                    messageDiv.innerHTML = '<div class="message error">❌ Error uploading PDF</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="message error">❌ Error: ' + error + '</div>';
            }
        }
        
        // Ask Question Function
        async function askQuestion() {
            const question = document.getElementById('questionInput').value;
            const messageDiv = document.getElementById('answerMessage');
            const answerDiv = document.getElementById('answerBox');
            
            if (!question) {
                messageDiv.innerHTML = '<div class="message error">Please enter a question</div>';
                return;
            }
            
            // Show loading message
            messageDiv.innerHTML = '<div class="message loading">⏳ Finding answer...</div>';
            answerDiv.innerHTML = '';
            
            try {
                // Send question to backend
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = '';
                    answerDiv.innerHTML = `<div class="answer-box"><strong>Answer:</strong><br>${data.answer}</div>`;
                    document.getElementById('questionInput').value = '';
                } else {
                    messageDiv.innerHTML = '<div class="message error">❌ Error getting answer</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="message error">❌ Error: ' + error + '</div>';
            }
        }
        
        // Allow Enter key to ask question
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('questionInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    askQuestion();
                }
            });
        });
    </script>
</body>
</html>
