<!DOCTYPE html>
<html>
<head>
<title>Form UI</title>
<style>
body{
     margin:0;
     height:100vh;
     display:flexbox;
     justify-content: center;
     align-items: center;
     font-family: sans-serif;
     font-size: small;
     background-color: antiquewhite;
}
.form-box{
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    padding: 40px;
    width:250px;
    border-radius: 22px;
    border-width: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    color: lightblue;
    animation: fadeIn 1s ease-in-out;
}






















    </style>
</head>
</html>
