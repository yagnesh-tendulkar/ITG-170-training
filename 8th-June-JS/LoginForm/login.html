<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>


<form id="loginForm">
    <h2>Login</h2>


    <input
        type="text"
        id="username"
        placeholder="Username"
        required
    />

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    />

    <button type="submit">
        Login
    </button>

</form>

<p id="message"></p>

<script src="js/login.js"></script>

</body>
</html>
